<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-primary bg-gradient min-vh-100 p-4">

    <div class="container bg-white border border-dark p-4 my-5 rounded">
        <div class="row justify-content-center">
            <div class="col-12 text-center">
                <h1 class="mb-3">Number Guessing Game</h1>
                <div class="mb-3">
                    <button onclick="istruzioni()" class="btn btn-link text-dark text-decoration-none fw-bold">➔ Istruzioni</button>
                </div>
                <div class="mb-3">
                    <button onclick="gioca()" class="btn btn-primary">GIOCA</button>
                </div>
                <div id="boxIstruzioni" class="alert alert-secondary d-none text-center">
                    Il Computer genera un numero casuale compreso tra 0 e 100. Tu dovrai indovinarlo. Hai a disposizione 7 tentativi.
                </div>
            </div>
        </div>
    </div>

    <div id="boxGioco" class="risposta container bg-white border p-4 my-3 rounded d-none">
        <div class="row justify-content-center mb-4">
            <div class="col-auto">
                <div class="input-group">
                    <input type="number" id="testoInput" class="form-control" placeholder="numero">
                    <button onclick="invia()" class="btn btn-primary">Check</button>
                </div>
            </div>
        </div>

        <div id="msg" class="text-center fw-bold fs-3 mb-4 d-none"></div>

        <div class="row text-center">
            <div class="col-sm-4">
                <i class="bi bi-joystick"></i>
                <h5>Tentativi Rimasti</h5>
                <div id="tentativiRimasti" class="fs-4">7</div>
            </div>
            <div class="col-sm-4">
                <i class="bi bi-info-square"></i>
                <h5>Suggerimenti</h5>
                <div id="suggerimenti" class="text-muted">i</div>
            </div>
            <div class="col-sm-4">
                <i class="bi bi-pencil-square"></i>
                <h5>Numeri inseriti</h5>
                <div id="numeriInseriti">-</div>
            </div>
        </div>
    </div>

    <script src="./js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
